services:
  app:
    build:
      dockerfile: ./Docker-build/app/Dockerfile
      context: ./
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://qwerty:zxc321@pg:5432/fastfood
#    volumes:
#      - ./fastapi-application:/app
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
    command:
      - python
      - main.py
    develop:
      watch:
        - action: sync+restart
          path: ./fastapi-application
          target: /app
        - action: rebuild
          path: ./poetry.lock

  pg:
    image: postgres:17.4
    environment:
      POSTGRES_DB: fastfood
      POSTGRES_USER: qwerty
      POSTGRES_PASSWORD: zxc321
      PGDATA: /var/lib/postgresql/data


    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 3s
      retries: 3


  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.org"
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      pg:
        condition: service_healthy

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Asia/Yekaterinburg
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

volumes:
  pgdata:
