services:
  pg:
    image: postgres
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: qwerty
      POSTGRES_PASSWORD: zxc321
    ports:
      - "5433:5432"

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Asia/Yekaterinburg
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
